<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <aside class="sidebar">
    <div class="title">
      <img src="./img/dashboard.svg" alt="Dashboard icon" height="50px" width="50px">
      <h1>Dashboard</h1>
    </div>
    <div class="page-group">
      <div class="btn-page">
        <img src="./img/home.svg" alt="House icon" height="20px" width="20px">
        <p>Home</p>
      </div>
      <div class="btn-page">
        <img src="./img/profile.svg" alt="id card icon" height="20px" width="20px">
        <p>Profile</p>
      </div>
      <div class="btn-page">
        <img src="./img/message.svg" alt="Message icon" height="20px" width="20px">
        <p>Messages</p>
      </div>
      <div class="btn-page">
        <img src="./img/history.svg" alt="Clock icon" height="20px" width="20px">
        <p>History</p>
      </div>
      <div class="btn-page">
        <img src="./img/tasks.svg" alt="Files icon" height="20px" width="20px">
        <p>Tasks</p>
      </div>
      <div class="btn-page">
        <img src="./img/community.svg" alt="People icon" height="20px" width="20px">
        <p>Communities</p>
      </div>
    </div>
    <div class="page-group">
      <div class="btn-page">
        <img src="./img/settings.svg" alt="Gear icon" height="20px" width="20px">
        <p>Settings</p>
      </div>
      <div class="btn-page">
        <img src="./img/help.svg" alt="question mark icon" height="20px" width="20px">
        <p>Support</p>
      </div>
      <div class="btn-page">
        <img src="./img/shield-check.svg" alt="shield with check mark icon" height="20px" width="20px">
        <p>Privacy</p>
      </div>
    </div>
  </aside>
  
  <header class="header"></header>
  <main class="main"></main>
</body>
</html>
